name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: npm quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify package-manager policy
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test "$(node -p "require('./package.json').packageManager")" = "npm@10.9.2"
          if grep -q '"packageManager"[[:space:]]*:[[:space:]]*"bun@' package.json; then
            echo "package.json declares Bun, but this repository uses npm as its canonical package manager." >&2
            exit 1
          fi

      - name: Install dependencies from the canonical lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
