name: Import missing modules from source

on:
  push:
    branches:
      - security/production-hardening-20260910
    paths:
      - .github/workflows/import-missing-modules.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          ref: security/production-hardening-20260910
          fetch-depth: 1

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: evaldo0510/cathedradigital
          ref: main
          path: .source-cathedra
          fetch-depth: 1

      - name: Import only missing runtime modules
        shell: bash
        run: |
          set -euo pipefail

          # Import only files that do not already exist in the hardened target.
          # Existing files are intentionally preserved so security fixes and
          # target-specific changes are never overwritten by the source repo.
          for root in \
            src/components \
            src/config \
            src/constants \
            src/content \
            src/contexts \
            src/core \
            src/data \
            src/features \
            src/hooks \
            src/integrations \
            src/pages \
            supabase/functions \
            supabase/seed \
            supabase/seeds; do
            if [ -d ".source-cathedra/$root" ]; then
              mkdir -p "$root"
              rsync -a --ignore-existing ".source-cathedra/$root/" "$root/"
            fi
          done

          rm -rf .source-cathedra

          echo "Imported files not previously present:"
          git status --short

      - name: Commit imported modules
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No missing modules to import."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src supabase/functions supabase/seed supabase/seeds
          git commit -m "feat: import missing runtime modules from source"
          git push origin HEAD:security/production-hardening-20260910

# Source modules are imported only when absent from the hardened target.
